# The Supabase CLI's settings for this repo. `supabase config push` sends
# only what this file declares to the hosted project; the rest stays as it is.
project_id = "field-app"

[auth.email]
# Sign up and sign in at once, without a confirmation email (the free plan
# sends only a few emails an hour, and our test users have no inbox).
enable_confirmations = false

[functions.push-assignment]
# Week 6, step 5: the push sender. The database trigger calls it with the
# project's secret key (checked in the code), not with a user's JWT.
enabled = true
verify_jwt = false
import_map = "./functions/push-assignment/deno.json"
entrypoint = "./functions/push-assignment/index.ts"
